<!-- ==========================================
     TruthLens AI
     Premium Report Modal
========================================== -->

<div id="reportModal" class="report-modal">

    <div class="report-modal-overlay"></div>

    <div class="report-modal-box">

        <!-- Header -->
        <div class="report-modal-header">

            <div>
                <span class="report-label">
                    TRUTHLENS AI
                </span>

                <h2>
                    AI Analysis Report
                </h2>
            </div>

            <button
                id="closeReport"
                class="report-close"
                type="button"
            >
                <i class="ri-close-line"></i>
            </button>

        </div>


        <!-- Prediction -->
        <div class="report-prediction">

            <p>Prediction</p>

            <div
                id="predictionBadge"
                class="prediction-badge"
            >
                ANALYZING
            </div>

        </div>


        <!-- Confidence -->
        <div class="report-section">

            <div class="section-title">

                <span>
                    Confidence
                </span>

                <strong id="confidenceText">
                    0%
                </strong>

            </div>

            <div class="confidence-bar">

                <div
                    id="confidenceFill"
                    class="confidence-fill"
                ></div>

            </div>

        </div>


        <!-- Metrics -->
        <div class="report-metrics">

            <div class="report-metric">

                <span>
                    <i class="ri-alert-line"></i>
                    Risk Level
                </span>

                <strong id="riskLevel">
                    Not available
                </strong>

            </div>


            <div class="report-metric">

                <span>
                    <i class="ri-file-list-3-line"></i>
                    Category
                </span>

                <strong id="category">
                    Other
                </strong>

            </div>


            <div class="report-metric">

                <span>
                    <i class="ri-emotion-line"></i>
                    Sentiment
                </span>

                <strong id="sentiment">
                    Neutral
                </strong>

            </div>

        </div>


        <!-- Summary -->
        <div class="report-content-section">

            <div class="report-content-title">

                <i class="ri-file-text-line"></i>

                <h3>
                    Summary
                </h3>

            </div>

            <p id="summary">
                No summary available.
            </p>

        </div>


        <!-- Explanation -->
        <div class="report-content-section">

            <div class="report-content-title">

                <i class="ri-sparkling-2-line"></i>

                <h3>
                    AI Explanation
                </h3>

            </div>

            <p id="explanation">
                No explanation available.
            </p>

        </div>


        <!-- Footer -->
        <div class="report-modal-footer">

            <span>
                <i class="ri-shield-check-line"></i>
                Generated by TruthLens AI
            </span>

            <div class="report-footer-actions">

                <button
                    type="button"
                    id="saveReportBtn"
                    class="report-save"
                >
                    <i class="ri-bookmark-line"></i>
                    Save Report
                </button>

                <button
                    type="button"
                    id="downloadReportBtn"
                    class="report-download"
                >
                    <i class="ri-download-2-line"></i>
                    Download
                </button>

                <button
                    type="button"
                    class="report-done"
                    onclick="closeReportModal()"
                >
                    Done
                </button>

            </div>

        </div>

    </div>

</div>
